name: Talkray
description: Talkray (operated by TiKL, Inc., a Y Combinator W12 startup founded in 2012 by Zafer
  Ahmed in Redwood City, California) was a free cross-platform messaging and calling app spanning
  the TiKL Touch-To-Talk and Talkray consumer apps, which together saw roughly 28 million downloads.
  In 2013 the company announced the Talkray Developer API, a white-label cloud platform for embedding
  one-on-one and group text chat, group voice calls, voicemail, push notifications, and image/video
  transfer into third-party mobile apps and games. That API never left private beta and no public
  documentation, OpenAPI, SDKs, or developer portal were ever published. The company is now defunct
  (deadpooled) - active development ceased around 2018 and the app was removed from Google Play in
  February 2021. talkray.com currently sits behind Cloudflare and returns HTTP 403 for all paths.
